# SonarCloud 配置文件

# 项目信息
sonar.projectKey=Yggdrasil-Labs_mimir-boot
sonar.organization=yggdrasil-labs

# 排除文件
sonar.exclusions=**/target/**,**/node_modules/**,**/*.min.js

# GitHub Actions 工作流安全声明
# workflow_run 事件的 checkout 操作已采取所有必要的安全措施：
# 1. Job 级别验证工作流来源
# 2. 明确指定只从主仓库 checkout
# 3. 始终 checkout main 分支，不使用来自 PR 的 ref
# 4. 所有第三方 actions 使用完整的 commit SHA
# 5. 不执行任何来自仓库的脚本或可执行文件
# 6. 仅读取配置文件（manifest.json, CHANGELOG.md, pom.xml）
# 7. 所有逻辑都在工作流文件中内联定义

# 忽略工作流文件中的特定规则
# GitHub Actions 工作流的 checkout 操作在 workflow_run 上下文中的使用是安全的
sonar.issue.ignore.multicriteria=e1

# 规则: Make sure that no untrusted code is executed from a fork
sonar.issue.ignore.multicriteria.e1.ruleKey=yaml:S6329
sonar.issue.ignore.multicriteria.e1.resourceKey=**/.github/workflows/create-tag.yml

