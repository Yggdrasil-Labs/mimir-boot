# Dependabot Configuration
# Strategy: Only allow patch updates for Spring ecosystem to maintain compatibility
version: 2
updates:
  # Maven 依赖更新
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "YoungerYang-Y"
    assignees:
      - "YoungerYang-Y"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "📦 deps"
    # 忽略破坏性版本更新
    ignore:
      # Spring Boot：锁定 3.3.x，minor 和 major 升级需架构 RFC
      - dependency-name: "org.springframework.boot:spring-boot-dependencies"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.boot:spring-boot-maven-plugin"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Spring Cloud：锁定 2023.0.x
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        update-types: ["version-update:semver-major"]
      # Spring Cloud Alibaba
      - dependency-name: "com.alibaba.cloud:spring-cloud-alibaba-dependencies"
        update-types: ["version-update:semver-major"]
      # MyBatis Plus
      - dependency-name: "com.baomidou:mybatis-plus-boot-starter"
        update-types: ["version-update:semver-major"]
      # 数据库驱动
      - dependency-name: "com.mysql:mysql-connector-j"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.postgresql:postgresql"
        update-types: ["version-update:semver-major"]
      # Redisson
      - dependency-name: "org.redisson:redisson-spring-boot-starter"
        update-types: ["version-update:semver-major"]
      # iText PDF
      - dependency-name: "com.itextpdf:itext-core"
        update-types: ["version-update:semver-major"]
      # springdoc-openapi（3.x 需 Boot 4.x）
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]
      # 消息队列
      - dependency-name: "org.apache.rocketmq:rocketmq-spring-boot-starter"
        update-types: ["version-update:semver-major"]
      # 搜索引擎与 NoSQL
      - dependency-name: "org.elasticsearch.client:elasticsearch-java"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mongodb:mongodb-driver-sync"
        update-types: ["version-update:semver-major"]
      # Maven 插件
      - dependency-name: "org.apache.maven.plugins:maven-compiler-plugin"
        update-types: ["version-update:semver-major"]
    # 允许的更新类型
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # 分组相关依赖
    groups:
      # Spring 生态（仅允许 patch）
      spring-ecosystem:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
          - "org.springframework.security:*"
          - "com.alibaba.cloud:*"
        update-types: ["patch"]
      database:
        patterns:
          - "com.mysql:*"
          - "org.postgresql:*"
          - "com.zaxxer:*"
          - "com.baomidou:*"
        update-types: ["minor", "patch"]
      # 测试框架
      testing:
        patterns:
          - "org.junit.jupiter:*"
          - "org.mockito:*"
          - "org.testcontainers:*"
        update-types: ["minor", "patch"]
      # 工具类
      utilities:
        patterns:
          - "org.projectlombok:*"
          - "cn.hutool:*"
          - "com.alibaba.fastjson2:*"
          - "com.fasterxml.jackson.*:*"
        update-types: ["minor", "patch"]
      # 监控和安全
      monitoring-security:
        patterns:
          - "io.micrometer:*"
          - "io.jsonwebtoken:*"
        update-types: ["minor", "patch"]
      # 消息队列
      messaging:
        patterns:
          - "org.springframework.kafka:*"
          - "org.apache.rocketmq:*"
        update-types: ["minor", "patch"]
      # 搜索引擎和NoSQL
      search-nosql:
        patterns:
          - "org.elasticsearch.client:*"
          - "org.mongodb:*"
        update-types: ["minor", "patch"]
      # 定时任务
      scheduling:
        patterns:
          - "com.xuxueli:*"
        update-types: ["minor", "patch"]
      # 分布式缓存
      caching:
        patterns:
          - "com.alicp.jetcache:*"
        update-types: ["minor", "patch"]
      # Maven 插件
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.springframework.boot:spring-boot-maven-plugin"
          - "org.jacoco:jacoco-maven-plugin"
          - "com.github.spotbugs:spotbugs-maven-plugin"
          - "org.codehaus.mojo:flatten-maven-plugin"
          - "org.sonarsource.scanner.maven:sonar-maven-plugin"
          # 构建工具链：spotless 与 Maven 发行版 / Wrapper 同组更新，
          # 避免 wrapper 与 apache-maven 各自成 PR 后改同一组 wrapper 文件互相冲突
          - "com.diffplug.spotless:*"
          - "org.apache.maven.wrapper:*"
          - "org.apache.maven:apache-maven"
        update-types: ["minor", "patch"]

  # GitHub Actions 更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "YoungerYang-Y"
    assignees:
      - "YoungerYang-Y"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "🧰 infra"
    groups:
      # GitHub Actions 的兼容性更新合并为一条 PR；major 保持独立审查。
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
