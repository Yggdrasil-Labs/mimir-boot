name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build, lint and test
        # Dependabot PR 只进行编译，跳过测试和格式检查
        # 其他 PR 和 push 事件执行完整的测试和格式检查
        if: github.actor != 'dependabot[bot]'
        # 使用 precheck profile 启用 JaCoCo 覆盖率报告生成
        # spotless:check 显式调用格式检查，不受 profile 影响
        run: ./mvnw -B -U spotless:check verify -Pprecheck

      - name: Build only (Dependabot)
        # Dependabot PR 只进行编译检查，不运行测试和格式检查
        if: github.actor == 'dependabot[bot]'
        run: ./mvnw -B -U clean compile -DskipTests

      - name: Upload test reports
        # Dependabot PR 不生成测试报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo coverage report
        # Dependabot PR 不生成覆盖率报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          retention-days: 7

  sonar:
    runs-on: ubuntu-latest
    needs: [ build ]
    # Dependabot PR 跳过 SonarQube 分析
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        # 使用 precheck profile 启用 JaCoCo 覆盖率报告生成
        # 注意：不使用 ci profile，因为格式检查已在 build job 中完成
        run: ./mvnw -B clean verify -Pprecheck

      - name: Find JaCoCo reports
        id: jacoco-reports
        run: |
          # 查找所有存在的 JaCoCo XML 报告文件，移除 ./ 前缀
          find . -path "*/target/site/jacoco/jacoco.xml" -type f | sed 's|^\./||' | sort > jacoco-reports.txt || true
          if [ -s jacoco-reports.txt ]; then
            # 将路径列表转换为逗号分隔的字符串
            JACOCO_PATHS=$(cat jacoco-reports.txt | tr '\n' ',' | sed 's/,$//')
            echo "paths=${JACOCO_PATHS}" >> $GITHUB_OUTPUT
            echo "Found JaCoCo reports:"
            cat jacoco-reports.txt
          else
            echo "paths=" >> $GITHUB_OUTPUT
            echo "Warning: No JaCoCo reports found"
          fi

      - name: Find test reports
        id: test-reports
        run: |
          # 查找所有存在的 Surefire 测试报告文件，移除 ./ 前缀
          find . -path "*/target/surefire-reports/TEST-*.xml" -type f | sed 's|^\./||' | sort > test-reports.txt || true
          if [ -s test-reports.txt ]; then
            # 将路径列表转换为逗号分隔的字符串
            TEST_PATHS=$(cat test-reports.txt | tr '\n' ',' | sed 's/,$//')
            echo "paths=${TEST_PATHS}" >> $GITHUB_OUTPUT
            echo "Found test reports:"
            cat test-reports.txt
          else
            echo "paths=" >> $GITHUB_OUTPUT
            echo "Warning: No test reports found"
          fi

      - name: Run Sonar analysis
        # 跳过 Dependabot PR 的 Sonar 分析（Dependabot 无法访问 secrets）
        # 同时检查 secrets 是否存在，避免因 secrets 缺失导致失败
        if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          JACOCO_PATHS: ${{ steps.jacoco-reports.outputs.paths }}
          TEST_PATHS: ${{ steps.test-reports.outputs.paths }}
        run: |
          SONAR_ARGS=(
            -B
            sonar:sonar
            -pl 'mimir-boot-parent,mimir-boot-bom,mimir-boot-common,mimir-boot-starters'
            -am
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${SONAR_ORGANIZATION}
            -Dsonar.projectKey=${SONAR_PROJECT_KEY}
            -Dsonar.java.source=17
            -Dsonar.java.target=17
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/pom.xml,**/examples/**
            -Dsonar.test.exclusions=**/pom.xml,**/examples/**
          )
          # 如果找到了覆盖率报告，则添加路径配置
          if [ -n "${JACOCO_PATHS}" ]; then
            SONAR_ARGS+=(-Dsonar.coverage.jacoco.xmlReportPaths="${JACOCO_PATHS}")
          fi
          # 如果找到了测试报告，则添加路径配置
          if [ -n "${TEST_PATHS}" ]; then
            SONAR_ARGS+=(-Dsonar.junit.reportPaths="${TEST_PATHS}")
          fi
          ./mvnw "${SONAR_ARGS[@]}"
