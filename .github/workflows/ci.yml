name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # 安全：只从主仓库 checkout，不信任 fork 的代码
          repository: ${{ github.repository }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Markdown lint
        if: github.actor != 'dependabot[bot]'
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: '**/*.md'

      - name: Build and test
        if: github.actor != 'dependabot[bot]'
        run: ./mvnw -B -U verify -Pci

      - name: Build only (Dependabot)
        # Dependabot PR 只进行编译检查，不运行测试和格式检查
        if: github.actor == 'dependabot[bot]'
        run: ./mvnw -B -U clean compile -DskipTests

      - name: Upload test reports
        # Dependabot PR 不生成测试报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo coverage report
        # Dependabot PR 不生成覆盖率报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          retention-days: 7

  sonar:
    runs-on: ubuntu-latest
    needs: [ build ]
    # Dependabot PR 跳过 SonarQube 分析
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # 安全：只从主仓库 checkout，不信任 fork 的代码
          repository: ${{ github.repository }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and analyze
        # 跳过 Dependabot PR 的 Sonar 分析（Dependabot 无法访问 secrets）
        # 同时检查 secrets 是否存在，避免因 secrets 缺失导致失败
        if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        run: |
          # 按照 SonarCloud 官方推荐的方式：在 verify 阶段同时运行 Sonar 分析
          # 使用 ci profile 执行完整的构建、测试和 Sonar 分析
          # ci profile 会自动跳过 GPG 签名（签名应在发布时进行）
          ./mvnw -B clean verify sonar:sonar -Pci \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
