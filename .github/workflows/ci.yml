name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Format check
        # Dependabot PR 跳过格式检查
        if: github.actor != 'dependabot[bot]'
        # ci profile 在 validate 阶段自动执行 spotless:check
        # 格式检查应在编译之前执行
        run: ./mvnw -B validate -Pci

      - name: Compile
        # Dependabot PR 跳过所有检查
        if: github.actor != 'dependabot[bot]'
        # 使用 ci profile
        # ci profile 包含：格式检查、覆盖率检查、依赖规则检查
        run: ./mvnw -B -U compile -Pci

      - name: Unit tests
        # Dependabot PR 跳过单元测试
        if: github.actor != 'dependabot[bot]'
        # ci profile 执行测试并生成覆盖率报告
        run: ./mvnw -B test -Pci

      - name: Build only (Dependabot)
        # Dependabot PR 只进行编译检查，不运行测试和格式检查
        if: github.actor == 'dependabot[bot]'
        run: ./mvnw -B -U clean compile -DskipTests

      - name: Upload test reports
        # Dependabot PR 不生成测试报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo coverage report
        # Dependabot PR 不生成覆盖率报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          retention-days: 7

  sonar:
    runs-on: ubuntu-latest
    needs: [ build ]
    # Dependabot PR 跳过 SonarQube 分析
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test for Sonar
        # 使用 ci profile 执行完整的构建和测试，生成覆盖率报告
        run: ./mvnw -B clean verify -Pci

      - name: Find JaCoCo reports
        id: jacoco-reports
        run: |
          # 查找所有存在的 JaCoCo XML 报告文件，移除 ./ 前缀，并过滤空行
          find . -path "*/target/site/jacoco/jacoco.xml" -type f 2>/dev/null | \
            sed 's|^\./||' | \
            grep -v '^$' | \
            sort > jacoco-reports.txt || true
          if [ -s jacoco-reports.txt ]; then
            # 将路径列表转换为逗号分隔的字符串，清理逗号前后的空格
            JACOCO_PATHS=$(cat jacoco-reports.txt | tr '\n' ',' | sed 's/,$//' | sed 's/,[ ]*/,/g' | sed 's/^[ ]*//' | sed 's/[ ]*$//')
            echo "paths=${JACOCO_PATHS}" >> $GITHUB_OUTPUT
            echo "Found JaCoCo reports:"
            cat jacoco-reports.txt
            echo ""
            echo "JaCoCo paths for Sonar: ${JACOCO_PATHS}"
          else
            echo "paths=" >> $GITHUB_OUTPUT
            echo "Warning: No JaCoCo reports found"
            echo "Searching for jacoco.xml files:"
            find . -name "jacoco.xml" -type f 2>/dev/null || echo "No jacoco.xml files found"
          fi

      - name: Run Sonar analysis
        # 跳过 Dependabot PR 的 Sonar 分析（Dependabot 无法访问 secrets）
        # 同时检查 secrets 是否存在，避免因 secrets 缺失导致失败
        if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          JACOCO_PATHS: ${{ steps.jacoco-reports.outputs.paths }}
        run: |
          SONAR_ARGS=(
            -B
            sonar:sonar
            -pl 'mimir-boot-parent,mimir-boot-bom,mimir-boot-common,mimir-boot-starters'
            -am
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${SONAR_ORGANIZATION}
            -Dsonar.projectKey=${SONAR_PROJECT_KEY}
            -Dsonar.java.source=17
            -Dsonar.java.target=17
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/pom.xml
            -Dsonar.test.exclusions=**/pom.xml
            -Dsonar.ci.automaticAnalysis=true
          )
          # 如果找到了覆盖率报告，验证文件存在后再添加路径配置
          if [ -n "${JACOCO_PATHS}" ]; then
            echo "Verifying JaCoCo report files exist:"
            IFS=',' read -ra PATHS <<< "${JACOCO_PATHS}"
            VALID_PATHS=()
            for path in "${PATHS[@]}"; do
              # 清理路径中的空格
              path=$(echo "$path" | sed 's/^[ ]*//' | sed 's/[ ]*$//')
              if [ -f "$path" ]; then
                VALID_PATHS+=("$path")
                echo "  ✓ Found: $path"
              else
                echo "  ✗ Missing: $path"
              fi
            done
            if [ ${#VALID_PATHS[@]} -gt 0 ]; then
              # 将有效路径重新组合为逗号分隔的字符串
              VALID_PATHS_STR=$(IFS=','; echo "${VALID_PATHS[*]}")
              SONAR_ARGS+=(-Dsonar.coverage.jacoco.xmlReportPaths="${VALID_PATHS_STR}")
              echo "Using JaCoCo paths: ${VALID_PATHS_STR}"
            else
              echo "Warning: No valid JaCoCo reports found, skipping coverage import"
            fi
          else
            echo "No JaCoCo paths provided, Sonar will use default locations"
          fi
          # SonarQube Maven 插件会自动发现测试报告，无需手动配置
          ./mvnw "${SONAR_ARGS[@]}"
