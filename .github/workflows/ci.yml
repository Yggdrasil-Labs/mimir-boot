name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Format check
        # Dependabot PR 跳过格式检查
        if: github.actor != 'dependabot[bot]'
        # ci profile 在 validate 阶段自动执行 spotless:check
        # 格式检查应在编译之前执行
        run: ./mvnw -B validate -Pci

      - name: Compile
        # Dependabot PR 跳过所有检查
        if: github.actor != 'dependabot[bot]'
        # 使用 ci profile
        # ci profile 包含：格式检查、覆盖率检查、依赖规则检查
        run: ./mvnw -B -U compile -Pci

      - name: Unit tests
        # Dependabot PR 跳过单元测试
        if: github.actor != 'dependabot[bot]'
        # ci profile 执行测试并生成覆盖率报告
        run: ./mvnw -B test -Pci

      - name: Build only (Dependabot)
        # Dependabot PR 只进行编译检查，不运行测试和格式检查
        if: github.actor == 'dependabot[bot]'
        run: ./mvnw -B -U clean compile -DskipTests

      - name: Upload test reports
        # Dependabot PR 不生成测试报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo coverage report
        # Dependabot PR 不生成覆盖率报告
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          retention-days: 7

  sonar:
    runs-on: ubuntu-latest
    needs: [ build ]
    # Dependabot PR 跳过 SonarQube 分析
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        run: |
          # 先执行构建和测试，生成覆盖率报告
          ./mvnw -B clean verify -Pci

      - name: Verify JaCoCo reports
        if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        run: |
          # 检查 JaCoCo 报告是否生成
          find . -name "jacoco.xml" -type f || echo "No jacoco.xml files found"
          find . -path "*/target/site/jacoco/jacoco.xml" -type f || echo "No jacoco reports found in expected locations"

      - name: Build and analyze
        # 跳过 Dependabot PR 的 Sonar 分析（Dependabot 无法访问 secrets）
        # 同时检查 secrets 是否存在，避免因 secrets 缺失导致失败
        if: ${{ github.actor != 'dependabot[bot]' && env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        run: |
          # 执行 SonarQube 分析（测试和覆盖率报告已在上一阶段生成）
          # 尝试多种属性名以确保兼容性
          ./mvnw -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml \
            -Dsonar.jacoco.reportPaths=**/target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=**/target/surefire-reports
