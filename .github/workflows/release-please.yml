name: Release Please

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # 使用默认的 GITHUB_TOKEN
          # 如需使用 PAT，可配置 token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # 禁用自动添加标签（如 autorelease: snapshot），由后续步骤手动添加自定义标签
          skip-labeling: true
          # 禁用自动创建 GitHub Release/Tag，交由 create-tag 工作流处理
          # 这样可以使用 PAT (RELEASE_TOKEN) 创建 Tag，从而自动触发 Release 构建工作流
          skip-github-release: true

      - name: Add 🚀 release label to PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -er '.number' <<< "$RELEASE_PR")

          if gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "🚀 release"; then
            echo "Added '🚀 release' label to PR #$PR_NUMBER"
          else
            echo "::warning::Release PR #$PR_NUMBER was created or updated, but its optional label could not be applied."
            echo "- ⚠️ Release PR #$PR_NUMBER was created or updated, but the optional label could not be applied." >> "$GITHUB_STEP_SUMMARY"
          fi
