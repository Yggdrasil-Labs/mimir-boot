name: Release Please

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38
        id: release
        continue-on-error: true
        with:
          # 使用默认的 GITHUB_TOKEN（已启用 "Allow GitHub Actions to create and approve pull requests"）
          # 如需使用 PAT，可配置 token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # 禁用自动添加标签（如 autorelease: snapshot），由后续步骤手动添加自定义标签
          skip-labeling: true

      - name: Check for existing release PR
        if: steps.release.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:release-please--branches--main--components--mimir-boot`,
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (prs.length > 0) {
              console.log(`ℹ️  Release PR already exists: #${prs[0].number}`);
              console.log(`   PR URL: ${prs[0].html_url}`);
              console.log(`   This is normal - release-please will update the existing PR when new changes are pushed.`);
              console.log(`   The workflow will continue despite this error.`);
            } else {
              console.log('⚠️  No existing release PR found, but release-please failed.');
              console.log('   This might be a temporary issue. Please check the error message above.');
            }

      - name: Add 🚀 release label to PR
        if: ${{ steps.release.outputs.pull_request_number != '' }}
        uses: actions-ecosystem/action-add-labels@bd52874380e3909a1ac983768df6976535ece7f8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.release.outputs.pull_request_number }}
          labels: |
            🚀 release
      
      - name: Find and label release PR (fallback)
        if: ${{ steps.release.outputs.pull_request_number == '' && steps.release.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:release-please--branches--main--components--mimir-boot`,
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (prs.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                labels: ['🚀 release']
              });
              console.log(`Added 🚀 release label to PR #${prs[0].number}`);
            }

      - name: Check if release PR was merged
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        id: check_release_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const isReleasePR = pr.head.ref.startsWith('release-please--branches--main--components--') ||
                               pr.title.includes('release') ||
                               pr.title.match(/chore\(main\): release/);
            
            console.log(`PR #${pr.number} merged: ${pr.merged}`);
            console.log(`PR head ref: ${pr.head.ref}`);
            console.log(`PR title: ${pr.title}`);
            console.log(`Is release PR: ${isReleasePR}`);
            
            core.setOutput('is_release_pr', isReleasePR.toString());
            core.setOutput('pr_number', pr.number.toString());
            core.setOutput('pr_title', pr.title);
            // merge_commit_sha 可能为空（squash/rebase merge），在这种情况下我们会在 checkout 时使用 'main' 分支
            core.setOutput('merge_commit_sha', pr.merge_commit_sha || '');

      - name: Checkout code for tag creation
        if: |
          (steps.release.outputs.release_created == 'true' && github.event_name == 'push') ||
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true && steps.check_release_pr.outcome == 'success' && steps.check_release_pr.outputs.is_release_pr == 'true')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # 如果是 PR 合并事件，checkout 到合并后的 commit（优先使用 merge_commit_sha，否则使用 main 分支）
          ref: ${{ github.event_name == 'pull_request' && (github.event.pull_request.merge_commit_sha || 'main') || github.ref }}

      - name: Extract version from pom.xml
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true && steps.check_release_pr.outcome == 'success' && steps.check_release_pr.outputs.is_release_pr == 'true') ||
          (steps.release.outputs.release_created == 'true' && github.event_name == 'push')
        id: get_version
        run: |
          # 尝试从 release-please 输出获取版本
          if [ -n "${{ steps.release.outputs.version }}" ] && [ "${{ steps.release.outputs.version }}" != "" ]; then
            VERSION="${{ steps.release.outputs.version }}"
            echo "Using version from release-please: $VERSION"
          else
            # 从 pom.xml 中提取版本号
            if [ -f "pom.xml" ]; then
              # 提取 <revision> 标签中的版本号（使用 sed，更兼容）
              VERSION=$(sed -n 's/.*<revision>\([^<]*\)<\/revision>.*/\1/p' pom.xml | head -1)
              if [ -z "$VERSION" ]; then
                # 如果没有 revision，尝试提取 <version>
                VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' pom.xml | head -1)
              fi
              if [ -z "$VERSION" ]; then
                echo "Error: Could not extract version from pom.xml"
                echo "pom.xml content (first 50 lines):"
                head -50 pom.xml
                exit 1
              fi
              echo "Extracted version from pom.xml: $VERSION"
            else
              echo "Error: pom.xml not found and no version from release-please"
              exit 1
            fi
          fi
          
          # 移除 -SNAPSHOT 后缀（如果有）
          VERSION=${VERSION%-SNAPSHOT}
          
          # 生成 tag 名称（确保以 v 开头）
          if [[ "$VERSION" =~ ^v ]]; then
            TAG_NAME="$VERSION"
          else
            TAG_NAME="v$VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Final version: $VERSION"
          echo "Final tag name: $TAG_NAME"

      - name: Create and push tag
        if: |
          (steps.release.outputs.release_created == 'true' && github.event_name == 'push') ||
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true && steps.check_release_pr.outcome == 'success' && steps.check_release_pr.outputs.is_release_pr == 'true')
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "=== Creating Tag for Release ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Version: $VERSION"
          echo "Tag name: $TAG_NAME"
          echo "================================="
          
          if [ -z "$TAG_NAME" ] || [ -z "$VERSION" ]; then
            echo "Error: TAG_NAME or VERSION is empty"
            echo "TAG_NAME: $TAG_NAME"
            echo "VERSION: $VERSION"
            exit 1
          fi
          
          # 确保 tag 名称以 'v' 开头
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
            echo "Adjusted tag name to: $TAG_NAME"
          fi
          
          # 获取当前 commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Current commit SHA: $COMMIT_SHA"
          
          # 检查 tag 是否已存在
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-parse "$TAG_NAME")
            if [ "$EXISTING_SHA" == "$COMMIT_SHA" ]; then
              echo "✓ Tag $TAG_NAME already exists and points to the same commit, skipping creation"
            else
              echo "⚠ Warning: Tag $TAG_NAME exists but points to different commit"
              echo "  Existing: $EXISTING_SHA"
              echo "  Current:  $COMMIT_SHA"
              exit 1
            fi
          else
            # 创建 tag（指向当前 HEAD，即合并后的 commit）
            echo "Creating annotated tag: $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $VERSION"
            git push origin "$TAG_NAME"
            echo "✓ Successfully created and pushed tag: $TAG_NAME"
            
            # 注意：使用 GITHUB_TOKEN 推送 tag 不会触发其他工作流
            # 因此我们需要手动触发 release 工作流
            echo "Triggering Release workflow via repository_dispatch..."
          fi

      - name: Trigger Release workflow
        if: steps.get_version.outputs.tag_name != '' && steps.get_version.outputs.version != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = '${{ steps.get_version.outputs.tag_name }}';
            const version = '${{ steps.get_version.outputs.version }}';
            
            console.log(`=== Triggering Release Workflow ===`);
            console.log(`Tag: ${tagName}`);
            console.log(`Version: ${version}`);
            console.log(`Event: ${context.eventName}`);
            
            if (!tagName || !version || tagName === '' || version === '') {
              console.log('⚠️  Skipping workflow trigger: tag name or version is empty');
              console.log(`   tagName: "${tagName}", version: "${version}"`);
              return;
            }
            
            try {
              // 获取工作流列表
              const { data: workflows } = await github.rest.actions.listWorkflowsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              
              console.log(`Found ${workflows.total_count} workflows`);
              
              // 查找 Release 工作流
              const releaseWorkflow = workflows.workflows.find(w => 
                w.name === 'Release' || 
                w.path === '.github/workflows/release.yml' ||
                w.path.endsWith('release.yml')
              );
              
              if (!releaseWorkflow) {
                console.log('⚠️  Release workflow not found');
                console.log('Available workflows:');
                workflows.workflows.forEach(w => {
                  console.log(`  - ${w.name} (${w.path})`);
                });
                return;
              }
              
              console.log(`Found Release workflow: ${releaseWorkflow.name} (ID: ${releaseWorkflow.id})`);
              
              // 触发工作流，使用 main 分支作为 ref（工作流会 checkout 到 tag）
              // ref 必须是分支名，不能是 tag
              const result = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: releaseWorkflow.id,
                ref: 'main', // 必须使用分支名，不能使用 tag
                inputs: {
                  version: version
                }
              });
              
              console.log(`✓ Successfully triggered Release workflow`);
              console.log(`   Workflow will checkout tag: ${tagName}`);
              console.log(`   Version: ${version}`);
            } catch (error) {
              console.log(`❌ Failed to trigger workflow via API`);
              console.log(`   Error: ${error.message}`);
              if (error.response) {
                console.log(`   Status: ${error.response.status}`);
                console.log(`   Response: ${JSON.stringify(error.response.data)}`);
              }
              console.log(`   You may need to manually trigger the Release workflow from the Actions tab.`);
              throw error; // 重新抛出错误，让工作流知道失败了
            }

