name: Release Please

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38
        id: release
        with:
          # 使用默认的 GITHUB_TOKEN（已启用 "Allow GitHub Actions to create and approve pull requests"）
          # 如需使用 PAT，可配置 token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # 禁用自动添加标签（如 autorelease: snapshot），由后续步骤手动添加自定义标签
          skip-labeling: true

      - name: Add 🚀 release label to PR
        if: ${{ steps.release.outputs.pull_request_number != '' }}
        uses: actions-ecosystem/action-add-labels@bd52874380e3909a1ac983768df6976535ece7f8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.release.outputs.pull_request_number }}
          labels: |
            🚀 release
      
      - name: Find and label release PR (fallback)
        if: ${{ steps.release.outputs.pull_request_number == '' && steps.release.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:release-please--branches--main--components--mimir-boot`,
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (prs.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                labels: ['🚀 release']
              });
              console.log(`Added 🚀 release label to PR #${prs[0].number}`);
            }

      - name: Checkout code for tag creation
        if: steps.release.outputs.release_created == 'true' && github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        if: steps.release.outputs.release_created == 'true' && github.event_name == 'push'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "=== Release Info ==="
          echo "Release created: ${{ steps.release.outputs.release_created }}"
          echo "Tag name from release-please: $TAG_NAME"
          echo "Version from release-please: $VERSION"
          echo "Event name: ${{ github.event_name }}"
          echo "==================="
          
          # 确定 tag 名称
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "" ]; then
            # 如果没有 tag_name，根据 version 生成（格式：v{version}）
            if [ -z "$VERSION" ] || [ "$VERSION" == "" ]; then
              echo "Error: Both TAG_NAME and VERSION are empty, cannot create tag"
              exit 1
            fi
            TAG_NAME="v$VERSION"
            echo "Generated tag name: $TAG_NAME from version: $VERSION"
          fi
          
          # 获取当前 commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Current commit SHA: $COMMIT_SHA"
          
          # 检查 tag 是否已存在
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-parse "$TAG_NAME")
            if [ "$EXISTING_SHA" == "$COMMIT_SHA" ]; then
              echo "✓ Tag $TAG_NAME already exists and points to the same commit, skipping creation"
            else
              echo "⚠ Warning: Tag $TAG_NAME exists but points to different commit"
              echo "  Existing: $EXISTING_SHA"
              echo "  Current:  $COMMIT_SHA"
            fi
          else
            # 创建 tag（指向当前 HEAD，即合并后的 commit）
            echo "Creating annotated tag: $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $VERSION"
            git push origin "$TAG_NAME"
            echo "✓ Successfully created and pushed tag: $TAG_NAME"
          fi

      - name: Output release info
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "Release PR: #${{ steps.release.outputs.pull_request_number }}"
          echo "Tag: ${{ steps.release.outputs.tag_name }}"
          echo "Version: ${{ steps.release.outputs.version }}"

