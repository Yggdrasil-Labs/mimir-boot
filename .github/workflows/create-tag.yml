name: Create Tag

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]
  # 手动恢复必须显式指定版本和目标提交，避免从当前 main 猜测。
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如：2.1.1，不需要 v 前缀）'
        required: true
        type: string
      target_sha:
        description: '要打 tag 的 40 位合并提交 SHA'
        required: true
        type: string

concurrency:
  group: create-tag-${{ github.event.workflow_run.head_sha || github.event.inputs.target_sha }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  check-release-pr-merged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release_pr: ${{ steps.check.outputs.is_release_pr }}
      merge_commit_sha: ${{ steps.check.outputs.merge_commit_sha }}
    steps:
      - name: Check whether the merged PR was created by Release Please
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowRun = context.payload.workflow_run;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: workflowRun.head_sha,
            });

            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const releaseBranch = /^release-please--branches--main(?:--components--[A-Za-z0-9_.-]+)?$/;
            const releaseTitle = /^chore\(main\): release [0-9]+\.[0-9]+\.[0-9]+$/i;
            const releasePR = prs.find(pr => {
              if (!pr.merged_at) return false;

              const isInternalPR = pr.head.repo?.full_name === repository;
              const isGeneratedByBot = pr.user?.login === 'github-actions[bot]';
              const isReleaseBranch = releaseBranch.test(pr.head.ref || '');
              const isReleaseTitle = releaseTitle.test(pr.title || '');
              return isInternalPR && isGeneratedByBot && isReleaseBranch && isReleaseTitle;
            });

            if (!releasePR || !releasePR.merge_commit_sha) {
              console.log('No merged Release Please PR is associated with this workflow run.');
              core.setOutput('is_release_pr', 'false');
              core.setOutput('merge_commit_sha', '');
              return;
            }

            console.log(`Found Release Please PR #${releasePR.number} at ${releasePR.merge_commit_sha}`);
            core.setOutput('is_release_pr', 'true');
            core.setOutput('merge_commit_sha', releasePR.merge_commit_sha);

  create-and-push-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-release-pr-merged]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.check-release-pr-merged.outputs.is_release_pr == 'true')
    permissions:
      contents: write
    steps:
      - name: Bootstrap release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preserve release-version guard
        run: cp .github/scripts/release-version.sh "$RUNNER_TEMP/release-version.sh"

      - name: Validate manual recovery target
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Error: target_sha must be a 40-character commit SHA"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_sha || needs.check-release-pr-merged.outputs.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release version
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-version.sh"

          if [ ! -f .github/.release-please-manifest.json ]; then
            echo "Error: Release Please manifest is missing from the target commit"
            exit 1
          fi
          MANIFEST_VERSION=$(jq -r '.["."] // empty' .github/.release-please-manifest.json)

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
            if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
              echo "Error: manual version $VERSION does not match target commit manifest version $MANIFEST_VERSION"
              exit 1
            fi
          else
            VERSION="$MANIFEST_VERSION"
          fi

          require_release_version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or verify release tag
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
          VERSION: ${{ steps.get_version.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          COMMIT_SHA=$(git rev-parse HEAD)
          git fetch --force --tags origin

          if git ls-remote --exit-code --refs origin "refs/tags/$TAG_NAME" >/dev/null; then
            EXISTING_COMMIT=$(git rev-parse "${TAG_NAME}^{commit}")
            if [ "$EXISTING_COMMIT" = "$COMMIT_SHA" ]; then
              echo "Tag $TAG_NAME already points to $COMMIT_SHA; no tag mutation is required."
              exit 0
            fi

            echo "Error: tag $TAG_NAME points to $EXISTING_COMMIT, not $COMMIT_SHA"
            exit 1
          fi

          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "Error: RELEASE_TOKEN secret is required to create release tags"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $VERSION" "$COMMIT_SHA"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG_NAME"
