name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发仅用于确定性的故障补偿；所有外部副作用均须显式选择。
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如：2.0.2，不需要 v 前缀）'
        required: true
        type: string
      publish_gpr:
        description: '补偿发布到 GitHub Packages'
        required: false
        type: boolean
        default: false
      publish_maven_central:
        description: '补偿发布到 Maven Central'
        required: false
        type: boolean
        default: false
      finalize_github_release:
        description: '补偿创建 GitHub Release'
        required: false
        type: boolean
        default: false
      update_dev_version:
        description: '补偿回写下一开发版本'
        required: false
        type: boolean
        default: false

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Validate manual recovery selection
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_GPR: ${{ github.event.inputs.publish_gpr }}
          PUBLISH_MAVEN_CENTRAL: ${{ github.event.inputs.publish_maven_central }}
          FINALIZE_GITHUB_RELEASE: ${{ github.event.inputs.finalize_github_release }}
          UPDATE_DEV_VERSION: ${{ github.event.inputs.update_dev_version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_GPR" != 'true' ] \
            && [ "$PUBLISH_MAVEN_CENTRAL" != 'true' ] \
            && [ "$FINALIZE_GITHUB_RELEASE" != 'true' ] \
            && [ "$UPDATE_DEV_VERSION" != 'true' ]; then
            echo "Error: select at least one recovery operation when manually dispatching Release"
            exit 1
          fi

      - name: Make Maven Wrapper executable
        run: |
          if [ ! -f "mvnw" ]; then
            echo "Error: mvnw not found"
            exit 1
          fi
          chmod +x mvnw

      # 完整构建与发布验收统一在后续共享门禁执行。

  release-consumer-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ release-verify ]
    permissions:
      contents: read
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Run shared quality gate
        if: hashFiles('scripts/engineering.sh') != ''
        run: bash scripts/engineering.sh quality --mode full --source worktree --report "${RUNNER_TEMP}/mimir-quality/quality-report.json"

      # 仅兼容手动补偿迁移前的不可变 tag；新版本不得降级到旧入口。
      - name: Verify legacy recovery tag
        if: hashFiles('scripts/engineering.sh') == ''
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo '新发布缺少统一工程入口' >&2; exit 2; }
          for required in scripts/ci-preflight.sh scripts/test-suite-consumer.sh; do
            [[ -f "$required" ]] || { echo "旧 tag 缺少原有必需门禁：$required" >&2; exit 2; }
          done
          if [[ -f scripts/test-suite-consumer-contract-test.sh ]]; then bash scripts/test-suite-consumer-contract-test.sh; fi
          bash scripts/test-suite-consumer.sh
          if [[ -f scripts/verify-release-signing.sh ]]; then bash scripts/verify-release-signing.sh --preheat; fi
          bash scripts/ci-preflight.sh

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: release-quality-report
          path: ${{ runner.temp }}/mimir-quality
          retention-days: 7

  publish-gpr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ release-verify, release-consumer-verify ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_gpr == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Prepare Maven release
        id: prepare
        uses: ./.github/actions/maven-release-prepare
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (Maven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # 保持 package 与直接 deploy goal 在同一 Maven 会话中：前者绑定构件，
          # 后者不经过 verify，因此与历史 GPR 行为一致，不触发 Central 专用的 GPG 签名。
          ./mvnw -B -Dmaven.test.skip=true -Drevision="$VERSION" \
            -Dmaven.deploy.skip=false \
            package \
            org.apache.maven.plugins:maven-deploy-plugin:deploy \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/$REPOSITORY

  publish-maven-central:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ release-verify, release-consumer-verify ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_maven_central == 'true' }}
    outputs:
      deployment_id: ${{ steps.publish.outputs.deployment_id }}
    permissions:
      contents: read
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Prepare Maven release
        id: prepare
        uses: ./.github/actions/maven-release-prepare
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}

      - name: Prepare shared engineering tools
        if: hashFiles('scripts/engineering.sh') != ''
        run: bash scripts/engineering.sh prepare

      - name: Configure GPG key
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "Error: GPG_PRIVATE_KEY secret not found"
            exit 1
          fi

          # 导入 GPG 密钥
          echo "Importing GPG key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import 2>&1
          
          # 验证密钥已导入
          KEY_COUNT=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c "^sec" || echo "0")
          if [ "$KEY_COUNT" -gt 0 ]; then
            echo "✓ GPG key imported successfully"
          else
            echo "✗ GPG key import failed"
            exit 1
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Maven for Central Portal
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>$MAVEN_CENTRAL_USERNAME</username>
                <password>$MAVEN_CENTRAL_PASSWORD</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish to Maven Central
        id: publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/maven-central-publish.log"
          echo "Publishing to Maven Central with version: $VERSION"
          # 激活 maven-central profile，使 central-publishing-maven-plugin（extensions=true）接管 deploy
          # -Dmaven.deploy.skip=false 覆盖 mimir-boot-parent 的默认值
          set +e
          ./mvnw -B -Dmaven.test.skip=true -Drevision="$VERSION" \
            -P maven-central \
            -Dmaven.deploy.skip=false \
            -Dgpg.skip=false \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            deploy 2>&1 | tee "$log_file"
          publish_status=${PIPESTATUS[0]}
          set -e

          deployment_id=$(sed -n 's/.*deploymentId: \([0-9a-fA-F-]\{36\}\).*/\1/p' "$log_file" | tail -n 1)
          if [[ -z "$deployment_id" ]]; then
            echo "Warning: Maven Central 发布已完成，但日志中未提取到 deployment ID。" >&2
          else
            echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          fi
          exit "$publish_status"

      - name: Observe Maven Central deployment
        id: observe
        if: always() && steps.publish.outputs.deployment_id != '' && hashFiles('scripts/engineering.sh') != ''
        continue-on-error: true
        env:
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/maven-central-deployment-status.json"
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')
          if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" \
            --output "$response_file"; then
            echo "Portal 状态查询失败；将由公开制品验证决定是否允许收尾。" >&2
            exit 1
          fi

          portal_state=$(bash scripts/engineering.sh portal-state "$response_file")
          echo "portal_state=$portal_state" >> "$GITHUB_OUTPUT"

          {
            echo "### Maven Central Portal 观察"
            echo
            echo "- deployment ID: \`$DEPLOYMENT_ID\`"
            echo '- 状态响应：'
            echo '```json'
            cat "$response_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$portal_state" == 'FAILED' ]]; then
            echo "Portal 已明确报告 FAILED；公开制品验证仍是收尾门禁，请在发布证据中核对此 deployment。" >&2
          fi

      - name: Record Maven Central publication evidence
        if: always()
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PORTAL_OBSERVE_OUTCOME: ${{ steps.observe.outcome }}
          PORTAL_STATE: ${{ steps.observe.outputs.portal_state }}
        run: |
          {
            echo "### Maven Central 发布证据"
            echo
            echo "- 版本：\`$VERSION\`"
            echo "- 上传步骤结果：\`$PUBLISH_OUTCOME\`"
            echo "- deployment ID：\`${DEPLOYMENT_ID:-未从日志提取}\`"
            echo "- Portal 观察：\`${PORTAL_STATE:-未取得状态}\`（步骤结果：\`${PORTAL_OBSERVE_OUTCOME:-未执行}\`）"
            echo "- [本次 workflow 日志]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-maven-central-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ release-verify, release-consumer-verify, publish-maven-central ]
    # 自动发布在 Central 上传后验证；手动补偿即使跳过上传，也必须在收尾前重新确认公开制品可用。
    if: >-
      ${{ always()
          && needs.release-verify.result == 'success'
          && needs['release-consumer-verify'].result == 'success'
          && (needs['publish-maven-central'].result == 'success'
              || (github.event_name == 'workflow_dispatch'
                  && needs['publish-maven-central'].result == 'skipped'
                  && (github.event.inputs.finalize_github_release == 'true'
                      || github.event.inputs.update_dev_version == 'true'))) }}
    permissions:
      contents: read
    steps:
      # 手动补偿旧 tag 时从默认分支取得新工具；自动发布则固定使用触发该发布的 tag。
      - name: Checkout public verification helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}

      - name: Set up JDK 17 for JAR verification
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify public Maven Central artifacts
        id: verify
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/engineering.sh public "${VERSION#v}"

      - name: Record public Maven Central verification evidence
        if: always()
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          version="${VERSION#v}"
          base_url='https://repo.maven.apache.org/maven2/io/github/yggdrasil-labs'
          {
            echo '### Maven Central 公开制品验证'
            echo
            echo "- 版本：\`$version\`"
            echo "- 验证步骤结果：\`$VERIFY_OUTCOME\`"
            echo "- 根 POM：\`$base_url/mimir-boot/$version/mimir-boot-$version.pom\`"
            echo "- Starter POM：\`$base_url/mimir-boot-starter-web/$version/mimir-boot-starter-web-$version.pom\`"
            echo "- Starter JAR：\`$base_url/mimir-boot-starter-web/$version/mimir-boot-starter-web-$version.jar\`"
          } >> "$GITHUB_STEP_SUMMARY"

  create-github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 等两个仓库发布都完成（成功或被跳过）后再创建 GitHub Release
    needs: [ release-verify, release-consumer-verify, publish-gpr, publish-maven-central, verify-maven-central-public ]
    if: >-
      ${{ always()
          && needs.release-verify.result == 'success'
          && needs['release-consumer-verify'].result == 'success'
          && (needs['publish-gpr'].result == 'success' || needs['publish-gpr'].result == 'skipped')
          && (needs['publish-maven-central'].result == 'success' || needs['publish-maven-central'].result == 'skipped')
          && needs['verify-maven-central-public'].result == 'success'
          && (github.event_name != 'workflow_dispatch' || github.event.inputs.finalize_github_release == 'true') }}
    permissions:
      contents: write
    steps:
      - name: Bootstrap release helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preserve release-version guard
        run: cp .github/scripts/release-version.sh "$RUNNER_TEMP/release-version.sh"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # tag push: 使用 github.ref; 手动触发: 使用对应标签
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Get version from tag or input
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            echo "Tag push detected"
          fi

          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # 默认 release notes（带图标）
          DEFAULT_NOTES="## 🚀 Release $VERSION

          Release $VERSION is now available! 🎉

          📝 See the [changelog](https://github.com/$REPOSITORY/blob/main/CHANGELOG.md) for details."
          
          # 检查 CHANGELOG.md 是否存在
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found, using default release notes"
            RELEASE_NOTES="$DEFAULT_NOTES"
          else
            # release-please 生成的 CHANGELOG 格式通常是：
            # ## [1.0.0] - 2024-01-01
            # 或
            # ## 1.0.0 - 2024-01-01
            
            # 尝试提取对应版本的 release notes
            # 使用 awk 提取从版本标题到下一个版本标题（或文件结尾）之间的内容
            EXTRACTED=$(awk -v version="$VERSION" '
              BEGIN {
                found=0
                in_section=0
              }
              /^## \[/ || /^## [0-9]/ {
                if (in_section) exit
                # 使用 index() 进行字面量字符串匹配，避免正则表达式元字符问题
                # 检查格式: ## [1.0.0] 或 ## 1.0.0
                if (index($0, "[" version "]") > 0 || index($0, "## " version) == 1) {
                  found=1
                  in_section=1
                  print
                  next
                }
              }
              in_section { print }
            ' CHANGELOG.md)
            
            if [ -n "$EXTRACTED" ] && [ ${#EXTRACTED} -gt 10 ]; then
              # 只为版本标题添加火箭图标（CHANGELOG已经包含章节和条目的图标）
              CHANGELOG_CONTENT=$(echo "$EXTRACTED" | sed \
                -e 's/^## \[\([^]]*\)\]/## 🚀 Release \1/g' \
                -e 's/^## \([0-9][^ ]*\) /## 🚀 Release \1 /g' \
                -e 's/BREAKING CHANGE/💥 BREAKING CHANGE/g' \
                -e 's/Breaking Change/💥 Breaking Change/g')
              
              # 分步骤构建 release notes，添加发布横幅和安装说明
              RELEASE_NOTES=""
              RELEASE_NOTES="${RELEASE_NOTES}🎉 **Release ${VERSION} is now available!**"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}${CHANGELOG_CONTENT}"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}📖 [View Full Changelog](https://github.com/$REPOSITORY/blob/main/CHANGELOG.md) | 📋 [Documentation](https://github.com/$REPOSITORY/blob/main/README.md)"
              
              echo "Successfully extracted and enhanced release notes from CHANGELOG.md"
            else
              echo "Could not extract release notes from CHANGELOG.md, using default"
              RELEASE_NOTES="$DEFAULT_NOTES"
            fi
          fi
          
          # 使用 multiline output
          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "Release notes prepared (first 300 chars):"
          echo "$RELEASE_NOTES" | head -c 300
          echo ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-dev-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 等 GitHub Release 创建成功后，再更新开发版本号
    needs: [ create-github-release, release-consumer-verify, publish-gpr, publish-maven-central, verify-maven-central-public ]
    # 自动路径在 GitHub Release 成功后回写；手动路径仅在明确选择后执行，
    # 且本次同时选择的发布或收尾操作必须成功，避免失败后错误推进 main。
    if: >-
      ${{ always()
          && needs['release-consumer-verify'].result == 'success'
          && needs['verify-maven-central-public'].result == 'success'
          && ((github.event_name != 'workflow_dispatch'
               && needs['create-github-release'].result == 'success')
              || (github.event_name == 'workflow_dispatch'
                  && github.event.inputs.update_dev_version == 'true'
                  && (github.event.inputs.publish_gpr != 'true'
                      || needs['publish-gpr'].result == 'success')
                  && (github.event.inputs.publish_maven_central != 'true'
                      || needs['publish-maven-central'].result == 'success')
                  && (github.event.inputs.finalize_github_release != 'true'
                      || needs['create-github-release'].result == 'success')
                  && (needs['create-github-release'].result == 'success'
                      || needs['create-github-release'].result == 'skipped'))) }}
    permissions:
      contents: write
    steps:
      - name: Bootstrap release helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preserve release-version guard
        run: cp .github/scripts/release-version.sh "$RUNNER_TEMP/release-version.sh"

      - name: Require release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "Error: RELEASE_TOKEN secret is required to push the next development version through CI"
            exit 1
          fi

      - name: Checkout current main for development version reconciliation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Get released version from tag
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ -z "$VERSION" ]; then
              echo "Error: version input is empty"
              exit 1
            fi
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            # 从 tag 获取版本
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
            echo "Tag push detected"
          fi

          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          # 获取 tag 指向的 commit SHA
          TAG_SHA=$(git rev-parse "${TAG_NAME}^{commit}")

          echo "Released version: $VERSION"
          echo "Tag: $TAG_NAME"
          echo "Tag commit SHA: $TAG_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release exists before manual development version recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_dev_version == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Calculate next development version
        id: next_version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          # 移除可能的 -SNAPSHOT 后缀（如果有）
          VERSION=${VERSION%-SNAPSHOT}
          
          # 解析版本号：主版本.次版本.修订版本
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # 计算下一个开发版本（patch + 1，然后加上 -SNAPSHOT）
          NEXT_PATCH=$((10#$PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          
          echo "Current released version: $VERSION"
          echo "Next development version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Reconcile next development version
        id: update_version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NEXT_VERSION: ${{ steps.next_version.outputs.next_version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "${NEXT_VERSION%-SNAPSHOT}"

          CURRENT_VERSION=$(sed -n 's|.*<revision>\([^<]*\)</revision>.*|\1|p' pom.xml)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: pom.xml does not contain a revision property"
            exit 1
          fi
          require_maven_revision "$CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$NEXT_VERSION" ]; then
            echo "Development version is already $NEXT_VERSION; no commit is required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Error: current main revision $CURRENT_VERSION is neither released version $VERSION nor next development version $NEXT_VERSION"
            exit 1
          fi

          echo "Updating pom.xml from $CURRENT_VERSION to $NEXT_VERSION"
          update_maven_revision pom.xml "$NEXT_VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.update_version.outputs.changed == 'true'
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.next_version }}
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add pom.xml
          git commit -m "chore: bump version to $NEXT_VERSION for next development cycle"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

          echo "Successfully updated version to $NEXT_VERSION"
