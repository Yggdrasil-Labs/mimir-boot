name: Release

on:
  push:
    tags:
      - 'v*'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如：2.0.2，不需要 v 前缀）'
        required: true
        type: string
      skip_gpr:
        description: '跳过 GitHub Packages 发布'
        required: false
        type: boolean
        default: false
      skip_maven_central:
        description: '跳过 Maven Central 发布'
        required: false
        type: boolean
        default: false

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC
  JAVA_VERSION: '17'

jobs:
  build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          # push 事件时，使用 github.ref（已经是 tag ref）
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ls -la mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Verify build (format check + compile)
        run: ./mvnw -B -U spotless:check clean package -DskipTests

  release:
    runs-on: ubuntu-latest
    needs: [ build-verify ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          # push 事件时，使用 github.ref（已经是 tag ref）
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Final verification
        run: |
          # 跳过 GPG 签名，签名只在实际发布时执行
          ./mvnw -B -U clean verify -Dgpg.skip=true

  publish-gpr:
    runs-on: ubuntu-latest
    needs: [ release ]
    # 手动触发时支持跳过
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_gpr != 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          # push 事件时，使用 github.ref（已经是 tag ref）
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ls -la mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Get version from tag or input
        id: get_version
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：从 input 获取版本
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            # Tag push：从 ref 获取版本
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
            echo "Tag push detected"
          fi
          
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update version in pom.xml for release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          if [ -z "$VERSION" ]; then
            echo "Error: Version is empty"
            exit 1
          fi
          
          echo "Updating pom.xml revision to: $VERSION"
          
          # 使用 sed 更新 pom.xml 中的版本号（GitHub Actions runner 是 Linux）
          sed -i "s|<revision>[^<]*</revision>|<revision>$VERSION</revision>|g" pom.xml
          
          echo "Updated pom.xml:"
          grep -A 2 -B 2 "<revision>" pom.xml
          
          # 验证所有子模块的 pom.xml 也会使用正确的版本号
          echo ""
          echo "Verifying version in submodules..."
          find . -name "pom.xml" -type f | head -5 | while read pom; do
            if grep -q "<version>\${revision}</version>" "$pom" 2>/dev/null; then
              echo "  ✓ $pom uses \${revision}"
            fi
          done

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten POM files before deploy
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Executing flatten:flatten to replace \${revision} variables with version: $VERSION"
          ./mvnw -B -U -Drevision=$VERSION flatten:flatten
          echo "Flatten completed. Verifying flattened POMs..."
          find . -name ".flattened-pom.xml" -type f | head -3 | while read pom; do
            echo "Checking: $pom"
            if grep -q "<version>\${revision}</version>" "$pom" 2>/dev/null; then
              echo "  ⚠️  WARNING: $pom still contains \${revision}"
            else
              echo "  ✓ $pom has been flattened correctly"
            fi
          done

      - name: Build packages (jar files)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Building packages with version: $VERSION"
          ./mvnw -B -U -DskipTests=true -Drevision=$VERSION \
            package
          echo "Verifying jar files were built..."
          find . -name "*.jar" -path "*/target/*" -not -path "*/original-*" | head -10

      - name: Publish to GitHub Packages (Maven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # 显式调用 maven-deploy-plugin，绕过 central-publishing-maven-plugin
          # 因为 central-publishing-maven-plugin 的 extensions=true 会接管 deploy 阶段
          # 但它不支持 -DaltDeploymentRepository 参数
          ./mvnw -B -U -DskipTests=true -Drevision=$VERSION \
            org.apache.maven.plugins:maven-deploy-plugin:deploy \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}

  publish-maven-central:
    runs-on: ubuntu-latest
    # 如果 publish-gpr 被跳过，则依赖 release；否则依赖 publish-gpr
    needs: [ release ]
    # 手动触发时支持跳过
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_maven_central != 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          # push 事件时，使用 github.ref（已经是 tag ref）
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ls -la mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Get version from tag or input
        id: get_version
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：从 input 获取版本
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            # Tag push：从 ref 获取版本
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
            echo "Tag push detected"
          fi
          
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update version in pom.xml for release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          if [ -z "$VERSION" ]; then
            echo "Error: Version is empty"
            exit 1
          fi
          
          echo "Updating pom.xml revision to: $VERSION"
          
          # 使用 sed 更新 pom.xml 中的版本号（GitHub Actions runner 是 Linux）
          sed -i "s|<revision>[^<]*</revision>|<revision>$VERSION</revision>|g" pom.xml
          
          echo "Updated pom.xml:"
          grep -A 2 -B 2 "<revision>" pom.xml

      - name: Configure GPG key
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "Error: GPG_PRIVATE_KEY secret not found"
            exit 1
          fi

          # 导入 GPG 密钥
          echo "Importing GPG key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import 2>&1
          
          # 验证密钥已导入
          KEY_COUNT=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c "^sec" || echo "0")
          if [ "$KEY_COUNT" -gt 0 ]; then
            echo "✓ GPG key imported successfully"
          else
            echo "✗ GPG key import failed"
            exit 1
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Maven for Central Portal
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>$MAVEN_CENTRAL_USERNAME</username>
                <password>$MAVEN_CENTRAL_PASSWORD</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Flatten POM files before deploy
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Executing flatten:flatten to replace \${revision} variables with version: $VERSION"
          ./mvnw -B -U -Drevision=$VERSION flatten:flatten
          echo "Flatten completed. Verifying flattened POMs..."
          find . -name ".flattened-pom.xml" -type f | head -3 | while read pom; do
            echo "Checking: $pom"
            if grep -q "<version>\${revision}</version>" "$pom" 2>/dev/null; then
              echo "  ⚠️  WARNING: $pom still contains \${revision}"
            else
              echo "  ✓ $pom has been flattened correctly"
            fi
          done

      - name: Build packages (jar files)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Building packages with version: $VERSION"
          ./mvnw -B -U -DskipTests=true -Drevision=$VERSION \
            package
          echo "Verifying jar files were built..."
          find . -name "*.jar" -path "*/target/*" -not -path "*/original-*" | head -10

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Publishing to Maven Central with version: $VERSION"
          # 启用 GPG 签名
          # 注意：passphrase 通过 -Dgpg.passphrase 传递，GitHub Actions 会自动遮蔽 secrets
          # 在 workflow 日志中显示为 ***
          ./mvnw -B -U -DskipTests=true -Drevision=$VERSION \
            -Dgpg.skip=false \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            deploy

  create-github-release:
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Get version from tag or input
        id: get_version
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            echo "Tag push detected"
          fi
          
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG_NAME="${{ steps.get_version.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # 默认 release notes（带图标）
          DEFAULT_NOTES="## 🚀 Release $VERSION
          
          Release $VERSION is now available! 🎉
          
          📝 See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          
          # 检查 CHANGELOG.md 是否存在
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found, using default release notes"
            RELEASE_NOTES="$DEFAULT_NOTES"
          else
            # release-please 生成的 CHANGELOG 格式通常是：
            # ## [1.0.0] - 2024-01-01
            # 或
            # ## 1.0.0 - 2024-01-01
            
            # 尝试提取对应版本的 release notes
            # 使用 awk 提取从版本标题到下一个版本标题（或文件结尾）之间的内容
            EXTRACTED=$(awk -v version="$VERSION" '
              BEGIN {
                found=0
                in_section=0
              }
              /^## \[/ || /^## [0-9]/ {
                if (in_section) exit
                # 使用 index() 进行字面量字符串匹配，避免正则表达式元字符问题
                # 检查格式: ## [1.0.0] 或 ## 1.0.0
                if (index($0, "[" version "]") > 0 || index($0, "## " version) == 1) {
                  found=1
                  in_section=1
                  print
                  next
                }
              }
              in_section { print }
            ' CHANGELOG.md)
            
            if [ -n "$EXTRACTED" ] && [ ${#EXTRACTED} -gt 10 ]; then
              # 只为版本标题添加火箭图标（CHANGELOG已经包含章节和条目的图标）
              CHANGELOG_CONTENT=$(echo "$EXTRACTED" | sed \
                -e 's/^## \[\([^]]*\)\]/## 🚀 Release \1/g' \
                -e 's/^## \([0-9][^ ]*\) /## 🚀 Release \1 /g' \
                -e 's/BREAKING CHANGE/💥 BREAKING CHANGE/g' \
                -e 's/Breaking Change/💥 Breaking Change/g')
              
              # 分步骤构建 release notes，添加发布横幅和安装说明
              RELEASE_NOTES=""
              RELEASE_NOTES="${RELEASE_NOTES}🎉 **Release ${VERSION} is now available!**"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}${CHANGELOG_CONTENT}"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}📖 [View Full Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) | 📋 [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)"
              
              echo "Successfully extracted and enhanced release notes from CHANGELOG.md"
            else
              echo "Could not extract release notes from CHANGELOG.md, using default"
              RELEASE_NOTES="$DEFAULT_NOTES"
            fi
          fi
          
          # 使用 multiline output
          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          echo "Release notes prepared (first 300 chars):"
          echo "$RELEASE_NOTES" | head -c 300
          echo ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-dev-version:
    runs-on: ubuntu-latest
    needs: [ release ]
    # 只在 tag push 时自动更新版本号，手动触发时跳过
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get released version from tag
        id: get_version
        run: |
          # 从 tag 获取版本
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
          
          # 获取 tag 指向的 commit SHA
          TAG_SHA=$(git rev-parse $TAG_NAME^{commit})
          
          echo "Released version: $VERSION"
          echo "Tag: $TAG_NAME"
          echo "Tag commit SHA: $TAG_SHA"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "tag_sha=$TAG_SHA" >> $GITHUB_OUTPUT

      - name: Calculate next development version
        id: next_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # 移除可能的 -SNAPSHOT 后缀（如果有）
          VERSION=${VERSION%-SNAPSHOT}
          
          # 解析版本号：主版本.次版本.修订版本
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # 计算下一个开发版本（patch + 1，然后加上 -SNAPSHOT）
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          
          echo "Current released version: $VERSION"
          echo "Next development version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Checkout main branch
        run: |
          git checkout main
          git pull origin main

      - name: Update version
        run: |
          NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"
          
          # 更新 pom.xml 中的版本号
          echo "Updating pom.xml to version: $NEXT_VERSION"
          sed -i.bak "s|<revision>[^<]*</revision>|<revision>$NEXT_VERSION</revision>|g" pom.xml
          rm -f pom.xml.bak
          
          echo "Updated pom.xml content:"
          grep -A 2 -B 2 "<revision>" pom.xml

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 在提交前拉取最新更改
          echo "Pulling latest changes from main before committing..."
          git pull --rebase origin main || git pull origin main
          
          # 添加所有更改的文件
          git add pom.xml
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "No changes to commit (version may already be updated)"
          else
            NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"
            
            # 构建提交消息
            COMMIT_MSG="chore: bump version to $NEXT_VERSION for next development cycle"
            
            git commit -m "$COMMIT_MSG"
            
            # 推送更改
            git push origin main
            
            echo "Successfully updated version to $NEXT_VERSION"
          fi
