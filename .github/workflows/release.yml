name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional when tag pushed)'
        required: false
  push:
    tags:
      - 'v*'

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC
  JAVA_VERSION: '17'

jobs:
  build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 如果是由 tag 触发，checkout 到 tag 对应的 commit，确保版本号正确
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ls -la mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Verify build (tests + coverage)
        run: ./mvnw -B -U spotless:check verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco/index.html
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [ build-verify ]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 如果是由 tag 触发，checkout 到 tag 对应的 commit，确保版本号正确
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Final verification
        run: ./mvnw -B -U clean verify

  publish-gpr:
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 如果是由 tag 触发，checkout 到 tag 对应的 commit，确保版本号正确
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ls -la mvnw
            echo "Maven Wrapper made executable"
          else
            echo "Error: mvnw not found"
            exit 1
          fi

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (Maven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -U -DskipTests=true \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} \
            deploy

  create-github-release:
    runs-on: ubuntu-latest
    needs: [ publish-gpr ]
    permissions:
      contents: write
    # 在 tag 推送或 workflow_dispatch 时执行
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 时，ref 参数已经是 tag，所以直接使用 github.ref
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Get version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            # 从 workflow_dispatch 输入获取版本
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v$VERSION"
            echo "Using version from workflow_dispatch input: $VERSION"
          else
            # 从 tag 获取版本（github.ref 在 workflow_dispatch 时也是 tag ref）
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
            echo "Using version from tag: $VERSION"
          fi
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG_NAME="${{ steps.get_version.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # 默认 release notes
          DEFAULT_NOTES="## Release $VERSION

          Release $VERSION is now available.

          See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          
          # 检查 CHANGELOG.md 是否存在
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found, using default release notes"
            RELEASE_NOTES="$DEFAULT_NOTES"
          else
            # release-please 生成的 CHANGELOG 格式通常是：
            # ## [1.0.0] - 2024-01-01
            # 或
            # ## 1.0.0 - 2024-01-01
            
            # 尝试提取对应版本的 release notes
            # 使用 awk 提取从版本标题到下一个版本标题（或文件结尾）之间的内容
            EXTRACTED=$(awk -v version="$VERSION" '
              BEGIN { found=0; in_section=0 }
              /^## \[/ || /^## [0-9]/ {
                if (in_section) exit
                if ($0 ~ "\\[" version "\\]" || $0 ~ "^## " version) {
                  found=1
                  in_section=1
                  print
                  next
                }
              }
              in_section { print }
            ' CHANGELOG.md)
            
            if [ -n "$EXTRACTED" ] && [ ${#EXTRACTED} -gt 10 ]; then
              RELEASE_NOTES="$EXTRACTED"
              echo "Successfully extracted release notes from CHANGELOG.md"
            else
              echo "Could not extract release notes from CHANGELOG.md, using default"
              RELEASE_NOTES="$DEFAULT_NOTES"
            fi
          fi
          
          # 使用 multiline output
          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          echo "Release notes prepared (first 300 chars):"
          echo "$RELEASE_NOTES" | head -c 300
          echo ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-dev-version:
    runs-on: ubuntu-latest
    needs: [ publish-gpr ]
    permissions:
      contents: write
    # 在 tag 推送或 workflow_dispatch 时执行
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get released version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            # 从 workflow_dispatch 输入获取版本
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v$VERSION"
            echo "Using version from workflow_dispatch input: $VERSION"
          else
            # 从 tag 获取版本
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
            echo "Using version from tag: $VERSION"
          fi
          echo "Released version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Calculate next development version
        id: next_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # 移除可能的 -SNAPSHOT 后缀（如果有）
          VERSION=${VERSION%-SNAPSHOT}
          
          # 解析版本号：主版本.次版本.修订版本
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # 计算下一个开发版本（patch + 1，然后加上 -SNAPSHOT）
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          
          echo "Current released version: $VERSION"
          echo "Next development version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Checkout main branch
        run: |
          git checkout main
          git pull origin main

      - name: Update version in pom.xml
        run: |
          NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"
          
          # 使用 sed 更新 pom.xml 中的版本号（Linux/Mac）
          sed -i.bak "s|<revision>[^<]*</revision>|<revision>$NEXT_VERSION</revision>|g" pom.xml
          rm -f pom.xml.bak
          
          echo "Updated pom.xml to version: $NEXT_VERSION"

      - name: Verify pom.xml changes
        run: |
          echo "Updated pom.xml content:"
          grep -A 2 -B 2 "<revision>" pom.xml

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add pom.xml
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "No changes to commit (version may already be updated)"
          else
            NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"
            git commit -m "chore: bump version to $NEXT_VERSION for next development cycle"
            git push origin main
            echo "Successfully updated version to $NEXT_VERSION"
          fi


