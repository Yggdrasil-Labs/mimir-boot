name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发仅用于确定性的故障补偿；所有外部副作用均须显式选择。
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如：2.0.2，不需要 v 前缀）'
        required: true
        type: string
      publish_gpr:
        description: '补偿发布到 GitHub Packages'
        required: false
        type: boolean
        default: false
      publish_maven_central:
        description: '补偿发布到 Maven Central'
        required: false
        type: boolean
        default: false
      finalize_github_release:
        description: '补偿创建 GitHub Release'
        required: false
        type: boolean
        default: false
      update_dev_version:
        description: '补偿回写下一开发版本'
        required: false
        type: boolean
        default: false

env:
  MAVEN_OPTS: -Xmx1024m -XX:+UseG1GC

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Validate manual recovery selection
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_GPR: ${{ github.event.inputs.publish_gpr }}
          PUBLISH_MAVEN_CENTRAL: ${{ github.event.inputs.publish_maven_central }}
          FINALIZE_GITHUB_RELEASE: ${{ github.event.inputs.finalize_github_release }}
          UPDATE_DEV_VERSION: ${{ github.event.inputs.update_dev_version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_GPR" != 'true' ] \
            && [ "$PUBLISH_MAVEN_CENTRAL" != 'true' ] \
            && [ "$FINALIZE_GITHUB_RELEASE" != 'true' ] \
            && [ "$UPDATE_DEV_VERSION" != 'true' ]; then
            echo "Error: select at least one recovery operation when manually dispatching Release"
            exit 1
          fi

      - name: Make Maven Wrapper executable
        run: |
          if [ ! -f "mvnw" ]; then
            echo "Error: mvnw not found"
            exit 1
          fi
          chmod +x mvnw

      - name: Verify build (format check + compile)
        run: ./mvnw -B spotless:check clean package -DskipTests

  publish-gpr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ release-verify ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_gpr == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Prepare Maven release
        id: prepare
        uses: ./.github/actions/maven-release-prepare
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (Maven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # 保持 package 与直接 deploy goal 在同一 Maven 会话中：前者绑定构件，
          # 后者不经过 verify，因此与历史 GPR 行为一致，不触发 Central 专用的 GPG 签名。
          ./mvnw -B -Dmaven.test.skip=true -Drevision="$VERSION" \
            -Dmaven.deploy.skip=false \
            package \
            org.apache.maven.plugins:maven-deploy-plugin:deploy \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/$REPOSITORY

  publish-maven-central:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ release-verify ]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_maven_central == 'true' }}
    permissions:
      contents: read
    steps:
      # 本地复合 Action 在检出后才可被 GitHub Actions 解析。
      - name: Bootstrap local Action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: ./.github/actions/checkout-setup
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - name: Prepare Maven release
        id: prepare
        uses: ./.github/actions/maven-release-prepare
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}

      - name: Configure GPG key
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "Error: GPG_PRIVATE_KEY secret not found"
            exit 1
          fi

          # 导入 GPG 密钥
          echo "Importing GPG key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import 2>&1
          
          # 验证密钥已导入
          KEY_COUNT=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep -c "^sec" || echo "0")
          if [ "$KEY_COUNT" -gt 0 ]; then
            echo "✓ GPG key imported successfully"
          else
            echo "✗ GPG key import failed"
            exit 1
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Maven for Central Portal
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>$MAVEN_CENTRAL_USERNAME</username>
                <password>$MAVEN_CENTRAL_PASSWORD</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          echo "Publishing to Maven Central with version: $VERSION"
          # 激活 maven-central profile，使 central-publishing-maven-plugin（extensions=true）接管 deploy
          # -Dmaven.deploy.skip=false 覆盖 mimir-boot-parent 的默认值
          ./mvnw -B -Dmaven.test.skip=true -Drevision="$VERSION" \
            -P maven-central \
            -Dmaven.deploy.skip=false \
            -Dgpg.skip=false \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            deploy

  create-github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 等两个仓库发布都完成（成功或被跳过）后再创建 GitHub Release
    needs: [ release-verify, publish-gpr, publish-maven-central ]
    if: >-
      ${{ always()
          && needs.release-verify.result == 'success'
          && (needs['publish-gpr'].result == 'success' || needs['publish-gpr'].result == 'skipped')
          && (needs['publish-maven-central'].result == 'success' || needs['publish-maven-central'].result == 'skipped')
          && (github.event_name != 'workflow_dispatch' || github.event.inputs.finalize_github_release == 'true') }}
    permissions:
      contents: write
    steps:
      - name: Bootstrap release helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preserve release-version guard
        run: cp .github/scripts/release-version.sh "$RUNNER_TEMP/release-version.sh"

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # tag push: 使用 github.ref; 手动触发: 使用对应标签
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Get version from tag or input
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            echo "Tag push detected"
          fi

          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # 默认 release notes（带图标）
          DEFAULT_NOTES="## 🚀 Release $VERSION

          Release $VERSION is now available! 🎉

          📝 See the [changelog](https://github.com/$REPOSITORY/blob/main/CHANGELOG.md) for details."
          
          # 检查 CHANGELOG.md 是否存在
          if [ ! -f "CHANGELOG.md" ]; then
            echo "CHANGELOG.md not found, using default release notes"
            RELEASE_NOTES="$DEFAULT_NOTES"
          else
            # release-please 生成的 CHANGELOG 格式通常是：
            # ## [1.0.0] - 2024-01-01
            # 或
            # ## 1.0.0 - 2024-01-01
            
            # 尝试提取对应版本的 release notes
            # 使用 awk 提取从版本标题到下一个版本标题（或文件结尾）之间的内容
            EXTRACTED=$(awk -v version="$VERSION" '
              BEGIN {
                found=0
                in_section=0
              }
              /^## \[/ || /^## [0-9]/ {
                if (in_section) exit
                # 使用 index() 进行字面量字符串匹配，避免正则表达式元字符问题
                # 检查格式: ## [1.0.0] 或 ## 1.0.0
                if (index($0, "[" version "]") > 0 || index($0, "## " version) == 1) {
                  found=1
                  in_section=1
                  print
                  next
                }
              }
              in_section { print }
            ' CHANGELOG.md)
            
            if [ -n "$EXTRACTED" ] && [ ${#EXTRACTED} -gt 10 ]; then
              # 只为版本标题添加火箭图标（CHANGELOG已经包含章节和条目的图标）
              CHANGELOG_CONTENT=$(echo "$EXTRACTED" | sed \
                -e 's/^## \[\([^]]*\)\]/## 🚀 Release \1/g' \
                -e 's/^## \([0-9][^ ]*\) /## 🚀 Release \1 /g' \
                -e 's/BREAKING CHANGE/💥 BREAKING CHANGE/g' \
                -e 's/Breaking Change/💥 Breaking Change/g')
              
              # 分步骤构建 release notes，添加发布横幅和安装说明
              RELEASE_NOTES=""
              RELEASE_NOTES="${RELEASE_NOTES}🎉 **Release ${VERSION} is now available!**"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}${CHANGELOG_CONTENT}"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              RELEASE_NOTES="${RELEASE_NOTES}"$'\n'$'\n'
              RELEASE_NOTES="${RELEASE_NOTES}📖 [View Full Changelog](https://github.com/$REPOSITORY/blob/main/CHANGELOG.md) | 📋 [Documentation](https://github.com/$REPOSITORY/blob/main/README.md)"
              
              echo "Successfully extracted and enhanced release notes from CHANGELOG.md"
            else
              echo "Could not extract release notes from CHANGELOG.md, using default"
              RELEASE_NOTES="$DEFAULT_NOTES"
            fi
          fi
          
          # 使用 multiline output
          {
            echo "release_notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "Release notes prepared (first 300 chars):"
          echo "$RELEASE_NOTES" | head -c 300
          echo ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-dev-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 等 GitHub Release 创建成功后，再更新开发版本号
    needs: [ create-github-release, publish-gpr, publish-maven-central ]
    # 自动路径在 GitHub Release 成功后回写；手动路径仅在明确选择后执行，
    # 且本次同时选择的发布或收尾操作必须成功，避免失败后错误推进 main。
    if: >-
      ${{ always()
          && ((github.event_name != 'workflow_dispatch'
               && needs['create-github-release'].result == 'success')
              || (github.event_name == 'workflow_dispatch'
                  && github.event.inputs.update_dev_version == 'true'
                  && (github.event.inputs.publish_gpr != 'true'
                      || needs['publish-gpr'].result == 'success')
                  && (github.event.inputs.publish_maven_central != 'true'
                      || needs['publish-maven-central'].result == 'success')
                  && (github.event.inputs.finalize_github_release != 'true'
                      || needs['create-github-release'].result == 'success')
                  && (needs['create-github-release'].result == 'success'
                      || needs['create-github-release'].result == 'skipped'))) }}
    permissions:
      contents: write
    steps:
      - name: Bootstrap release helpers
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preserve release-version guard
        run: cp .github/scripts/release-version.sh "$RUNNER_TEMP/release-version.sh"

      - name: Require release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "Error: RELEASE_TOKEN secret is required to push the next development version through CI"
            exit 1
          fi

      - name: Checkout current main for development version reconciliation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Get released version from tag
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # 支持 tag push 和手动触发两种方式
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            if [ -z "$VERSION" ]; then
              echo "Error: version input is empty"
              exit 1
            fi
            TAG_NAME="v${VERSION}"
            echo "Manual trigger detected"
          else
            # 从 tag 获取版本
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 'v' 前缀
            echo "Tag push detected"
          fi

          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          # 获取 tag 指向的 commit SHA
          TAG_SHA=$(git rev-parse "${TAG_NAME}^{commit}")

          echo "Released version: $VERSION"
          echo "Tag: $TAG_NAME"
          echo "Tag commit SHA: $TAG_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release exists before manual development version recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_dev_version == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Calculate next development version
        id: next_version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "$VERSION"

          # 移除可能的 -SNAPSHOT 后缀（如果有）
          VERSION=${VERSION%-SNAPSHOT}
          
          # 解析版本号：主版本.次版本.修订版本
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # 计算下一个开发版本（patch + 1，然后加上 -SNAPSHOT）
          NEXT_PATCH=$((10#$PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          
          echo "Current released version: $VERSION"
          echo "Next development version: $NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Reconcile next development version
        id: update_version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NEXT_VERSION: ${{ steps.next_version.outputs.next_version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-version.sh"
          require_release_version "${NEXT_VERSION%-SNAPSHOT}"

          CURRENT_VERSION=$(sed -n 's|.*<revision>\([^<]*\)</revision>.*|\1|p' pom.xml)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: pom.xml does not contain a revision property"
            exit 1
          fi
          require_maven_revision "$CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$NEXT_VERSION" ]; then
            echo "Development version is already $NEXT_VERSION; no commit is required."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Error: current main revision $CURRENT_VERSION is neither released version $VERSION nor next development version $NEXT_VERSION"
            exit 1
          fi

          echo "Updating pom.xml from $CURRENT_VERSION to $NEXT_VERSION"
          update_maven_revision pom.xml "$NEXT_VERSION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.update_version.outputs.changed == 'true'
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.next_version }}
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add pom.xml
          git commit -m "chore: bump version to $NEXT_VERSION for next development cycle"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

          echo "Successfully updated version to $NEXT_VERSION"
