name: Checkout and Setup
description: |
  Checkout repository at release tag and set up JDK 17 with Maven caching.
  Used by build-verify, release, publish-gpr, and publish-maven-central jobs.
  Not used by create-github-release (no Java needed) or update-dev-version
  (needs token-based checkout).

inputs:
  ref:
    description: 'Git ref to checkout (release tag)'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
